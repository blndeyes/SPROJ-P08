services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriqual-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriqual-backend
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: production
      PORT: 5000

      MONGO_URI: mongodb://mongo:27017/agriqual
      REDIS_URL: redis://redis:6379
      ML_BASE_URL: http://ml:8001

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_TO_EMAIL: ${SUPPORT_TO_EMAIL}
    depends_on:
      - mongo
      - redis
      - ml
    restart: unless-stopped

  ml:
    build:
      context: ./backend/ml
      dockerfile: Dockerfile
    container_name: agriqual-ml
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: agriqual-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agriqual-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
